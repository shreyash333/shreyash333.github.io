<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess - Premium Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <!-- Include chess.js for game logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
    <div class="ambient-bg"></div>

    <div class="game-layout">
        <aside class="sidebar glass-panel">
            <header class="sidebar-header">
                <h2>Premium <span>Chess</span></h2>
            </header>

            <div class="status-panel">
                <div class="status-indicator" id="turn-indicator">White to Move</div>
                <div class="status-text" id="status-text">Game started</div>
            </div>

            <div class="captured-area">
                <div class="captured-title">Captured by White</div>
                <div class="captured-pieces" id="captured-by-white"></div>
                <div class="captured-title" style="margin-top: 15px;">Captured by Black</div>
                <div class="captured-pieces" id="captured-by-black"></div>
            </div>

            <div class="controls">
                <button id="reset-btn" class="glow-btn">New Game</button>
                <button id="undo-btn" class="outline-btn">Undo Move</button>
            </div>
        </aside>

        <main class="board-area">
            <div class="board-wrapper glass-panel">
                <div class="board-ranks">
                    <span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
                </div>
                <div class="board-inner">
                    <div id="chessboard" class="chessboard"></div>
                    <div class="board-files">
                        <span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
